  <text x="270" y="149" fill="#94A3B8" font-size="8.5">  applied_at</text>

  <rect x="518" y="20" width="180" height="120" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>

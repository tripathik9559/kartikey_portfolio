<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', 'Courier New', monospace">
  <defs>
    <marker id="arr1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06B6D4"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="300" fill="#070B14" rx="12"/>
  <rect width="820" height="300" fill="url(#grid)" rx="12" opacity="0.4"/>

  <!-- Docker Compose outer wrapper -->
  <rect x="10" y="14" width="800" height="268" rx="10" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.5"/>
  <text x="20" y="30" fill="#3B82F6" font-size="10" opacity="0.8">⬡ Docker Compose</text>

  <!-- Render Cloud label -->
  <rect x="680" y="14" width="126" height="22" rx="6" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
  <text x="743" y="28" fill="#60A5FA" font-size="9.5" text-anchor="middle">☁ Render Cloud</text>

  <!-- ── CLIENT LAYER ── -->
  <text x="75" y="60" fill="#475569" font-size="9" text-anchor="middle" letter-spacing="1">CLIENT</text>

  <!-- Student box -->
  <rect x="14" y="66" width="122" height="58" rx="8" fill="rgba(15,22,42,0.9)" stroke="rgba(59,130,246,0.35)" stroke-width="1.2"/>
  <text x="75" y="88" fill="#60A5FA" font-size="18" text-anchor="middle">🎓</text>
  <text x="75" y="105" fill="#94A3B8" font-size="10" text-anchor="middle" font-weight="600">Student</text>
  <text x="75" y="118" fill="#475569" font-size="8.5" text-anchor="middle">Face-Capture Login</text>

  <!-- Teacher box -->
  <rect x="14" y="138" width="122" height="50" rx="8" fill="rgba(15,22,42,0.9)" stroke="rgba(6,182,212,0.3)" stroke-width="1.2"/>
  <text x="75" y="158" fill="#22D3EE" font-size="17" text-anchor="middle">👩‍🏫</text>
  <text x="75" y="174" fill="#94A3B8" font-size="10" text-anchor="middle" font-weight="600">Teacher</text>
  <text x="75" y="184" fill="#475569" font-size="8" text-anchor="middle">Upload Answer Keys</text>

  <!-- Admin box -->
  <rect x="14" y="200" width="122" height="50" rx="8" fill="rgba(15,22,42,0.9)" stroke="rgba(139,92,246,0.3)" stroke-width="1.2"/>
  <text x="75" y="220" fill="#A78BFA" font-size="17" text-anchor="middle">🛡️</text>
  <text x="75" y="236" fill="#94A3B8" font-size="10" text-anchor="middle" font-weight="600">Admin</text>
  <text x="75" y="246" fill="#475569" font-size="8" text-anchor="middle">Platform Management</text>

  <!-- ── ARROWS CLIENT → GUNICORN ── -->
  <line x1="136" y1="95" x2="240" y2="95" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="188" y="89" fill="#3B82F6" font-size="8" text-anchor="middle">HTTPS</text>
  <line x1="136" y1="163" x2="240" y2="163" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arr2)"/>
  <line x1="136" y1="225" x2="240" y2="225" stroke="#8B5CF6" stroke-width="1.5" marker-end="url(#arr1)" stroke-dasharray="4,2"/>

  <!-- ── GUNICORN / DJANGO ── -->
  <text x="348" y="52" fill="#475569" font-size="9" text-anchor="middle" letter-spacing="1">APPLICATION</text>
  <rect x="244" y="58" width="208" height="210" rx="10" fill="rgba(10,16,30,0.95)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>

  <!-- Gunicorn label -->
  <rect x="256" y="66" width="184" height="28" rx="6" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="348" y="84" fill="#93C5FD" font-size="10" text-anchor="middle" font-weight="700">⚡ Gunicorn WSGI</text>

  <!-- Django box -->
  <rect x="256" y="102" width="184" height="154" rx="8" fill="rgba(68,183,139,0.06)" stroke="rgba(68,183,139,0.25)" stroke-width="1"/>
  <text x="348" y="120" fill="#34D399" font-size="10" text-anchor="middle" font-weight="700">🐍 Django MVT</text>

  <text x="266" y="140" fill="#64748B" font-size="8.5">► Views &amp; URL Routing</text>
  <text x="266" y="155" fill="#64748B" font-size="8.5">► Template Engine</text>
  <text x="266" y="170" fill="#64748B" font-size="8.5">► ORM (Model Layer)</text>
  <text x="266" y="185" fill="#64748B" font-size="8.5">► Auth &amp; RBAC</text>
  <text x="266" y="200" fill="#64748B" font-size="8.5">► Session Middleware</text>
  <text x="266" y="218" fill="#64748B" font-size="8.5">► Camera API Handler</text>
  <text x="266" y="236" fill="#64748B" font-size="8.5">► Auto-grade Engine</text>
  <text x="266" y="249" fill="#64748B" font-size="8.5">► Result Processor</text>

  <!-- ── ARROWS DJANGO → DB ── -->
  <line x1="452" y1="130" x2="546" y2="130" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr1)"/>
  <text x="499" y="124" fill="#3B82F6" font-size="8" text-anchor="middle">ORM</text>
  <line x1="452" y1="215" x2="546" y2="215" stroke="#22D3EE" stroke-width="1.5" marker-end="url(#arr2)"/>
  <text x="499" y="209" fill="#22D3EE" font-size="8" text-anchor="middle">redis-py</text>

  <!-- ── DATA LAYER ── -->
  <text x="650" y="52" fill="#475569" font-size="9" text-anchor="middle" letter-spacing="1">DATA</text>

  <!-- PostgreSQL box -->
  <rect x="550" y="58" width="200" height="108" rx="10" fill="rgba(15,22,42,0.9)" stroke="rgba(51,103,145,0.5)" stroke-width="1.5"/>
  <text x="650" y="82" fill="#4A9ECC" font-size="18" text-anchor="middle">🐘</text>
  <text x="650" y="100" fill="#93C5FD" font-size="11" text-anchor="middle" font-weight="700">PostgreSQL</text>
  <text x="650" y="116" fill="#475569" font-size="8.5" text-anchor="middle">Users · Exams · Questions</text>
  <text x="650" y="130" fill="#475569" font-size="8.5" text-anchor="middle">Submissions · Results</text>
  <text x="650" y="144" fill="#334155" font-size="8" text-anchor="middle">Primary Database</text>
  <text x="650" y="158" fill="#334155" font-size="8" text-anchor="middle">Persistent Storage</text>

  <!-- Redis box -->
  <rect x="550" y="176" width="200" height="90" rx="10" fill="rgba(15,22,42,0.9)" stroke="rgba(220,38,38,0.3)" stroke-width="1.5"/>
  <text x="650" y="198" fill="#F87171" font-size="18" text-anchor="middle">⚡</text>
  <text x="650" y="216" fill="#FCA5A5" font-size="11" text-anchor="middle" font-weight="700">Redis</text>
  <text x="650" y="232" fill="#475569" font-size="8.5" text-anchor="middle">Session Management</text>
  <text x="650" y="246" fill="#475569" font-size="8.5" text-anchor="middle">Exam State · Caching</text>
  <text x="650" y="260" fill="#334155" font-size="8" text-anchor="middle">In-Memory Store</text>
</svg>

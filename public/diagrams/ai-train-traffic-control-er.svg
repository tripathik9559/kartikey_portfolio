<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <rect width="820" height="300" fill="#070B14" rx="12"/>

  <!-- TRAIN table -->
  <rect x="14" y="20" width="145" height="140" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="14" y="20" width="145" height="28" rx="8" fill="rgba(59,130,246,0.18)"/>
  <rect x="14" y="40" width="145" height="8" fill="rgba(59,130,246,0.18)"/>
  <text x="86" y="38" fill="#93C5FD" font-size="10.5" text-anchor="middle" font-weight="700">🚆 TRAIN</text>
  <text x="22" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="22" y="79" fill="#94A3B8" font-size="8.5">  train_number</text>
  <text x="22" y="93" fill="#94A3B8" font-size="8.5">  name</text>
  <text x="22" y="107" fill="#34D399" font-size="8.5">  type (ENUM)</text>
  <text x="22" y="121" fill="#94A3B8" font-size="8.5">  max_speed_kmph</text>
  <text x="22" y="135" fill="#94A3B8" font-size="8.5">  capacity</text>
  <text x="22" y="149" fill="#94A3B8" font-size="8.5">  status</text>

  <!-- ROUTE table -->
  <rect x="220" y="20" width="150" height="140" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
  <rect x="220" y="20" width="150" height="28" rx="8" fill="rgba(139,92,246,0.18)"/>
  <rect x="220" y="40" width="150" height="8" fill="rgba(139,92,246,0.18)"/>
  <text x="295" y="38" fill="#C4B5FD" font-size="10.5" text-anchor="middle" font-weight="700">🗺 ROUTE</text>
  <text x="228" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="228" y="79" fill="#94A3B8" font-size="8.5">  name</text>
  <text x="228" y="93" fill="#94A3B8" font-size="8.5">  origin_station</text>
  <text x="228" y="107" fill="#94A3B8" font-size="8.5">  destination_station</text>
  <text x="228" y="121" fill="#94A3B8" font-size="8.5">  distance_km</text>
  <text x="228" y="135" fill="#94A3B8" font-size="8.5">  total_segments</text>
  <text x="228" y="149" fill="#94A3B8" font-size="8.5">  is_active</text>

  <!-- TRACK_SEGMENT table -->
  <rect x="440" y="20" width="165" height="140" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
  <rect x="440" y="20" width="165" height="28" rx="8" fill="rgba(6,182,212,0.18)"/>
  <rect x="440" y="40" width="165" height="8" fill="rgba(6,182,212,0.18)"/>
  <text x="522" y="38" fill="#67E8F9" font-size="10.5" text-anchor="middle" font-weight="700">🛤 TRACK_SEGMENT</text>
  <text x="448" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="448" y="79" fill="#F87171" font-size="8.5">🔗 route_id (FK→Route)</text>
  <text x="448" y="93" fill="#94A3B8" font-size="8.5">  segment_code</text>
  <text x="448" y="107" fill="#94A3B8" font-size="8.5">  from_station</text>
  <text x="448" y="121" fill="#94A3B8" font-size="8.5">  to_station</text>
  <text x="448" y="135" fill="#94A3B8" font-size="8.5">  capacity (trains)</text>
  <text x="448" y="149" fill="#34D399" font-size="8.5">  speed_zone</text>

  <!-- SCHEDULE table -->
  <rect x="14" y="180" width="165" height="108" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
  <rect x="14" y="180" width="165" height="28" rx="8" fill="rgba(16,185,129,0.15)"/>
  <rect x="14" y="200" width="165" height="8" fill="rgba(16,185,129,0.15)"/>
  <text x="96" y="198" fill="#6EE7B7" font-size="10.5" text-anchor="middle" font-weight="700">📅 SCHEDULE</text>
  <text x="22" y="225" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="22" y="240" fill="#F87171" font-size="8.5">🔗 train_id · route_id (FK)</text>
  <text x="22" y="255" fill="#94A3B8" font-size="8.5">  departure · arrival</text>
  <text x="22" y="270" fill="#94A3B8" font-size="8.5">  priority · status</text>
  <text x="22" y="284" fill="#94A3B8" font-size="8.5">  platform_no</text>

  <!-- CONFLICT table -->
  <rect x="220" y="180" width="180" height="108" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(248,113,113,0.5)" stroke-width="1.5"/>
  <rect x="220" y="180" width="180" height="28" rx="8" fill="rgba(248,113,113,0.15)"/>
  <rect x="220" y="200" width="180" height="8" fill="rgba(248,113,113,0.15)"/>
  <text x="310" y="198" fill="#FCA5A5" font-size="10.5" text-anchor="middle" font-weight="700">⚠ CONFLICT</text>
  <text x="228" y="225" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="228" y="240" fill="#F87171" font-size="8.5">🔗 train1_id · train2_id (FK)</text>
  <text x="228" y="255" fill="#F87171" font-size="8.5">🔗 segment_id (FK)</text>
  <text x="228" y="270" fill="#94A3B8" font-size="8.5">  detected_at · severity</text>
  <text x="228" y="284" fill="#94A3B8" font-size="8.5">  resolved · resolution</text>

  <!-- DECISION_LOG table -->
  <rect x="620" y="20" width="186" height="140" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <rect x="620" y="20" width="186" height="28" rx="8" fill="rgba(245,158,11,0.12)"/>
  <rect x="620" y="40" width="186" height="8" fill="rgba(245,158,11,0.12)"/>
  <text x="713" y="38" fill="#FCD34D" font-size="10.5" text-anchor="middle" font-weight="700">🤖 DECISION_LOG</text>
  <text x="628" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="628" y="79" fill="#F87171" font-size="8.5">🔗 conflict_id (FK)</text>
  <text x="628" y="93" fill="#94A3B8" font-size="8.5">  ai_recommendation</text>
  <text x="628" y="107" fill="#94A3B8" font-size="8.5">  operator_action</text>
  <text x="628" y="121" fill="#94A3B8" font-size="8.5">  confidence_score</text>
  <text x="628" y="135" fill="#94A3B8" font-size="8.5">  timestamp</text>
  <text x="628" y="149" fill="#94A3B8" font-size="8.5">  outcome</text>

  <!-- Relation lines -->
  <line x1="159" y1="80" x2="220" y2="80" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="189" y="74" fill="#8B5CF6" font-size="8" text-anchor="middle">1:M</text>

  <line x1="370" y1="80" x2="440" y2="80" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="405" y="74" fill="#06B6D4" font-size="8" text-anchor="middle">1:M</text>

  <line x1="86" y1="160" x2="86" y2="180" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="100" y="174" fill="#10B981" font-size="8">1:M</text>

  <line x1="295" y1="160" x2="295" y2="180" stroke="#F87171" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="309" y="174" fill="#F87171" font-size="8">1:M</text>

  <line x1="400" y1="240" x2="620" y2="100" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="510" y="165" fill="#F59E0B" font-size="8" text-anchor="middle">logs</text>
</svg>

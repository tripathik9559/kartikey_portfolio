  <text x="332" y="39" fill="#6EE7B7" font-size="10.5" text-anchor="middle" font-weight="700">🐍 NLP Pipeline</text>
  <text x="242" y="68" fill="#94A3B8" font-size="8.5">1. Text Preprocessing</text>
  <text x="242" y="82" fill="#64748B" font-size="8">   Tokenize · lowercase</text>

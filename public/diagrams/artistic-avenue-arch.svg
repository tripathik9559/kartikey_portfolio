<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#06B6D4"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8B5CF6"/>
    </marker>
    <marker id="a4" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#10B981"/>
    </marker>
  </defs>

  <rect width="820" height="300" fill="#070B14" rx="12"/>

  <!-- ── CLIENT BROWSERS ── -->
  <text x="83" y="22" fill="#475569" font-size="9" text-anchor="middle" letter-spacing="1">CLIENTS</text>
  <!-- Artist Browser -->
  <rect x="14" y="30" width="138" height="56" rx="8" fill="rgba(15,22,42,0.9)" stroke="rgba(236,72,153,0.4)" stroke-width="1.5"/>
  <text x="83" y="52" fill="#F9A8D4" font-size="17" text-anchor="middle">🎨</text>
  <text x="83" y="68" fill="#94A3B8" font-size="10" text-anchor="middle" font-weight="600">Artist</text>
  <text x="83" y="80" fill="#475569" font-size="8" text-anchor="middle">Upload &amp; Manage Art</text>

  <!-- Buyer Browser -->
  <rect x="14" y="98" width="138" height="56" rx="8" fill="rgba(15,22,42,0.9)" stroke="rgba(59,130,246,0.4)" stroke-width="1.5"/>
  <text x="83" y="120" fill="#93C5FD" font-size="17" text-anchor="middle">🛒</text>
  <text x="83" y="136" fill="#94A3B8" font-size="10" text-anchor="middle" font-weight="600">Buyer</text>
  <text x="83" y="148" fill="#475569" font-size="8" text-anchor="middle">Browse &amp; Purchase</text>

  <!-- Admin browser -->
  <rect x="14" y="166" width="138" height="56" rx="8" fill="rgba(15,22,42,0.9)" stroke="rgba(245,158,11,0.3)" stroke-width="1.5"/>
  <text x="83" y="188" fill="#FCD34D" font-size="17" text-anchor="middle">🛡</text>
  <text x="83" y="204" fill="#94A3B8" font-size="10" text-anchor="middle" font-weight="600">Admin</text>
  <text x="83" y="216" fill="#475569" font-size="8" text-anchor="middle">Django Admin Panel</text>

  <!-- Arrows to Django -->
  <line x1="152" y1="58" x2="220" y2="100" stroke="#EC4899" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="152" y1="126" x2="220" y2="140" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="152" y1="194" x2="220" y2="185" stroke="#F59E0B" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="185" y="117" fill="#3B82F6" font-size="8" text-anchor="middle">HTTP</text>

  <!-- ── DJANGO MVT ── -->
  <rect x="224" y="20" width="226" height="260" rx="10" fill="rgba(10,16,30,0.95)" stroke="rgba(68,183,139,0.5)" stroke-width="1.5"/>
  <rect x="224" y="20" width="226" height="32" rx="10" fill="rgba(68,183,139,0.2)"/>
  <rect x="224" y="44" width="226" height="8" fill="rgba(68,183,139,0.2)"/>
  <text x="337" y="41" fill="#6EE7B7" font-size="11" text-anchor="middle" font-weight="700">🐍 Django MVT Framework</text>

  <!-- URL Router -->
  <rect x="234" y="60" width="206" height="28" rx="6" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <text x="337" y="78" fill="#93C5FD" font-size="9" text-anchor="middle">🔀 URL Router (urls.py)</text>

  <!-- Views -->
  <rect x="234" y="96" width="206" height="68" rx="6" fill="rgba(139,92,246,0.07)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="337" y="112" fill="#C4B5FD" font-size="9" text-anchor="middle" font-weight="600">⚙ Views (views.py)</text>
  <text x="242" y="128" fill="#64748B" font-size="8">► ArtworkListView · ArtistProfileView</text>
  <text x="242" y="142" fill="#64748B" font-size="8">► CategoryBrowseView · SearchView</text>
  <text x="242" y="156" fill="#64748B" font-size="8">► CartView · Auth (Login/Register)</text>

  <!-- Templates -->
  <rect x="234" y="172" width="206" height="56" rx="6" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <text x="337" y="188" fill="#67E8F9" font-size="9" text-anchor="middle" font-weight="600">📄 Templates (HTML/CSS/JS)</text>
  <text x="242" y="204" fill="#64748B" font-size="8">► home · gallery · artist-profile</text>
  <text x="242" y="218" fill="#64748B" font-size="8">► artwork-detail · cart · admin</text>

  <!-- Models -->
  <rect x="234" y="236" width="206" height="36" rx="6" fill="rgba(16,185,129,0.07)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
  <text x="337" y="252" fill="#6EE7B7" font-size="9" text-anchor="middle" font-weight="600">🗂 Models (ORM → SQLite)</text>
  <text x="242" y="265" fill="#64748B" font-size="8">User · Artist · Artwork · Category · Order</text>

  <!-- Arrow Django → SQLite -->
  <line x1="450" y1="170" x2="518" y2="155" stroke="#10B981" stroke-width="1.5" marker-end="url(#a4)"/>
  <text x="483" y="154" fill="#10B981" font-size="8" text-anchor="middle">ORM</text>

  <!-- Arrow Django → Media -->
  <line x1="450" y1="220" x2="518" y2="245" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="484" y="242" fill="#06B6D4" font-size="8" text-anchor="middle">store</text>

  <!-- Arrow Django → Admin -->
  <line x1="450" y1="255" x2="674" y2="255" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#a1)"/>
  <text x="562" y="248" fill="#F59E0B" font-size="8" text-anchor="middle">Django Admin</text>

  <!-- ── SQLITE DB ── -->
  <rect x="522" y="30" width="168" height="170" rx="10" fill="rgba(15,22,42,0.9)" stroke="rgba(16,185,129,0.45)" stroke-width="1.5"/>
  <rect x="522" y="30" width="168" height="30" rx="10" fill="rgba(16,185,129,0.15)"/>
  <rect x="522" y="52" width="168" height="8" fill="rgba(16,185,129,0.15)"/>
  <text x="606" y="49" fill="#6EE7B7" font-size="10.5" text-anchor="middle" font-weight="700">🗄 SQLite DB</text>
  <text x="530" y="76" fill="#64748B" font-size="8">Tables:</text>
  <text x="530" y="91" fill="#475569" font-size="8">► auth_user (Django built-in)</text>
  <text x="530" y="105" fill="#475569" font-size="8">► marketplace_artist</text>
  <text x="530" y="119" fill="#475569" font-size="8">► marketplace_artwork</text>
  <text x="530" y="133" fill="#475569" font-size="8">► marketplace_category</text>
  <text x="530" y="147" fill="#475569" font-size="8">► marketplace_order</text>
  <text x="530" y="161" fill="#475569" font-size="8">► marketplace_cart</text>
  <text x="606" y="190" fill="#334155" font-size="7.5" text-anchor="middle">PostgreSQL-ready schema</text>

  <!-- ── MEDIA STORAGE ── -->
  <rect x="522" y="212" width="168" height="68" rx="10" fill="rgba(15,22,42,0.9)" stroke="rgba(6,182,212,0.35)" stroke-width="1.5"/>
  <rect x="522" y="212" width="168" height="28" rx="10" fill="rgba(6,182,212,0.12)"/>
  <rect x="522" y="232" width="168" height="8" fill="rgba(6,182,212,0.12)"/>
  <text x="606" y="229" fill="#67E8F9" font-size="10" text-anchor="middle" font-weight="700">📁 Media Storage</text>
  <text x="530" y="254" fill="#64748B" font-size="8">MEDIA_ROOT / artwork_images/</text>
  <text x="530" y="268" fill="#64748B" font-size="8">MEDIA_URL served by Django</text>
  <text x="530" y="277" fill="#334155" font-size="7.5">File: jpg · png · webp</text>

  <!-- Django Admin panel -->
  <rect x="700" y="212" width="110" height="68" rx="10" fill="rgba(15,22,42,0.9)" stroke="rgba(245,158,11,0.35)" stroke-width="1.5"/>
  <rect x="700" y="212" width="110" height="28" rx="10" fill="rgba(245,158,11,0.12)"/>
  <rect x="700" y="232" width="110" height="8" fill="rgba(245,158,11,0.12)"/>
  <text x="755" y="229" fill="#FCD34D" font-size="9.5" text-anchor="middle" font-weight="700">🛡 Admin Panel</text>
  <text x="708" y="252" fill="#64748B" font-size="8">CRUD: Artworks</text>
  <text x="708" y="266" fill="#64748B" font-size="8">Manage Users</text>
  <text x="708" y="277" fill="#334155" font-size="7.5">/admin/ route</text>

  <!-- Status tag -->
  <rect x="724" y="14" width="86" height="20" rx="4" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
  <text x="767" y="27" fill="#10B981" font-size="8.5" text-anchor="middle">✓ Completed</text>
</svg>

  <text x="22" y="229" fill="#94A3B8" font-size="8.5">  model_name (YOLO/Haar)</text>
  <text x="22" y="244" fill="#94A3B8" font-size="8.5">  weights_path</text>
  <text x="22" y="259" fill="#94A3B8" font-size="8.5">  confidence_threshold</text>
  <text x="22" y="274" fill="#94A3B8" font-size="8.5">  nms_threshold</text>

  <rect x="520" y="210" width="185" height="80" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(245,158,11,0.4)" stroke-width="1.5"/>
  <rect x="520" y="210" width="185" height="28" rx="8" fill="rgba(245,158,11,0.12)"/>
  <text x="612" y="228" fill="#FCD34D" font-size="10.5" text-anchor="middle" font-weight="700">🏷 OBJECT_CLASS</text>
  <text x="528" y="254" fill="#FBBF24" font-size="8.5">🔑 class_id</text>
  <text x="528" y="269" fill="#94A3B8" font-size="8.5">  class_name (person/car…)</text>
  <text x="528" y="284" fill="#94A3B8" font-size="8.5">  supercategory</text>

  <line x1="194" y1="90" x2="265" y2="100" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="229" y="88" fill="#8B5CF6" font-size="8" text-anchor="middle">1:M</text>
  <line x1="450" y1="100" x2="520" y2="100" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="485" y="94" fill="#06B6D4" font-size="8" text-anchor="middle">1:M</text>
  <line x1="612" y1="195" x2="612" y2="210" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="626" y="205" fill="#F59E0B" font-size="8">M:1</text>
</svg>
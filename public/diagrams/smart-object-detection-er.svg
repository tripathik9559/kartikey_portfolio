<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace"><rect width="820" height="300" fill="#070B14" rx="12"/>
  <rect x="14" y="20" width="180" height="145" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="14" y="20" width="180" height="28" rx="8" fill="rgba(59,130,246,0.18)"/>
  <text x="104" y="38" fill="#93C5FD" font-size="10.5" text-anchor="middle" font-weight="700">📹 VIDEO_STREAM</text>
  <text x="22" y="64" fill="#FBBF24" font-size="8.5">🔑 stream_id</text>
  <text x="22" y="79" fill="#94A3B8" font-size="8.5">  source_type (cam/file/image)</text>
  <text x="22" y="93" fill="#94A3B8" font-size="8.5">  resolution (w × h)</text>
  <text x="22" y="107" fill="#94A3B8" font-size="8.5">  fps_target</text>
  <text x="22" y="121" fill="#94A3B8" font-size="8.5">  start_timestamp</text>
  <text x="22" y="135" fill="#94A3B8" font-size="8.5">  filepath (if file source)</text>
  <text x="22" y="149" fill="#94A3B8" font-size="8.5">  total_frames</text>

  <rect x="265" y="20" width="185" height="160" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
  <rect x="265" y="20" width="185" height="28" rx="8" fill="rgba(139,92,246,0.18)"/>
  <text x="357" y="38" fill="#C4B5FD" font-size="10.5" text-anchor="middle" font-weight="700">🖼 FRAME</text>
  <text x="273" y="64" fill="#FBBF24" font-size="8.5">🔑 frame_id</text>
  <text x="273" y="79" fill="#F87171" font-size="8.5">🔗 stream_id (FK)</text>
  <text x="273" y="93" fill="#94A3B8" font-size="8.5">  frame_number</text>
  <text x="273" y="107" fill="#94A3B8" font-size="8.5">  timestamp_ms</text>
  <text x="273" y="121" fill="#94A3B8" font-size="8.5">  raw_pixels (ndarray ref)</text>
  <text x="273" y="135" fill="#94A3B8" font-size="8.5">  fps_actual</text>
  <text x="273" y="149" fill="#94A3B8" font-size="8.5">  objects_detected (count)</text>
  <text x="273" y="163" fill="#94A3B8" font-size="8.5">  inference_time_ms</text>

  <rect x="520" y="20" width="185" height="175" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
  <rect x="520" y="20" width="185" height="28" rx="8" fill="rgba(6,182,212,0.18)"/>
  <text x="612" y="38" fill="#67E8F9" font-size="10.5" text-anchor="middle" font-weight="700">📦 DETECTION</text>
  <text x="528" y="64" fill="#FBBF24" font-size="8.5">🔑 detection_id</text>
  <text x="528" y="79" fill="#F87171" font-size="8.5">🔗 frame_id (FK)</text>
  <text x="528" y="93" fill="#F87171" font-size="8.5">🔗 class_id (FK→ObjectClass)</text>
  <text x="528" y="107" fill="#94A3B8" font-size="8.5">  bbox_x · bbox_y</text>
  <text x="528" y="121" fill="#94A3B8" font-size="8.5">  bbox_w · bbox_h</text>
  <text x="528" y="135" fill="#94A3B8" font-size="8.5">  confidence_score</text>
  <text x="528" y="149" fill="#94A3B8" font-size="8.5">  label_text</text>
  <text x="528" y="163" fill="#94A3B8" font-size="8.5">  color_assigned</text>
  <text x="528" y="177" fill="#94A3B8" font-size="8.5">  is_tracked</text>

  <rect x="14" y="185" width="180" height="105" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(68,183,139,0.45)" stroke-width="1.5"/>

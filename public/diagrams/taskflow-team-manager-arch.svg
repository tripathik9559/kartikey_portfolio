  <text x="542" y="260" fill="#64748B" font-size="8">Auto-deploy from GitHub</text>
  <text x="542" y="272" fill="#64748B" font-size="8">Env vars · Managed DB</text>

  <rect x="730" y="14" width="82" height="20" rx="4" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>

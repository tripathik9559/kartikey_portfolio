  <text x="268" y="157" fill="#64748B" font-size="8">► JWT Auth</text>
  <text x="268" y="171" fill="#64748B" font-size="8">► Request Validation</text>
  <text x="268" y="185" fill="#64748B" font-size="8">► Error Handler</text>
  <text x="268" y="210" fill="#334155" font-size="7.5">──────────────────────</text>
  <text x="268" y="225" fill="#334155" font-size="8">Express.js · Node.js</text>
  <text x="268" y="240" fill="#334155" font-size="8">Railway Deployment</text>


  <line x1="458" y1="150" x2="528" y2="150" stroke="#06B6D4" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="493" y="144" fill="#06B6D4" font-size="8" text-anchor="middle">SQL</text>

  <!-- PostgreSQL -->
  <rect x="532" y="30" width="180" height="180" rx="10" fill="rgba(15,22,42,0.9)" stroke="rgba(51,103,145,0.5)" stroke-width="1.5"/>
  <rect x="532" y="30" width="180" height="30" rx="10" fill="rgba(51,103,145,0.18)"/>

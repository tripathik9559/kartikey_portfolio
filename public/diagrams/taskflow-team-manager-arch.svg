<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <rect width="820" height="300" fill="#070B14" rx="12"/>
  <defs>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L0,6 L8,3 z" fill="#3B82F6"/>
  </marker>
</defs>
  <!-- React Frontend -->
  <rect x="14" y="30" width="170" height="240" rx="10" fill="rgba(10,16,30,0.95)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="14" y="30" width="170" height="30" rx="10" fill="rgba(59,130,246,0.18)"/>

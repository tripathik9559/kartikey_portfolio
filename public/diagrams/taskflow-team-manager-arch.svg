  <text x="24" y="108" fill="#64748B" font-size="8">► Member Management</text>
  <text x="24" y="123" fill="#64748B" font-size="8">► Task Detail View</text>
  <text x="24" y="138" fill="#64748B" font-size="8">► Status Filters</text>
  <text x="24" y="158" fill="#334155" font-size="7.5">──────────────────</text>
  <text x="24" y="173" fill="#334155" font-size="8">React · Axios</text>
  <text x="24" y="188" fill="#334155" font-size="8">REST Client</text>

  <!-- Arrow -->
  <line x1="184" y1="150" x2="254" y2="150" stroke="#3B82F6" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="219" y="144" fill="#3B82F6" font-size="8" text-anchor="middle">REST</text>

  <!-- Express API -->
  <rect x="258" y="20" width="200" height="260" rx="10" fill="rgba(10,16,30,0.95)" stroke="rgba(68,183,139,0.5)" stroke-width="1.5"/>
  <rect x="258" y="20" width="200" height="30" rx="10" fill="rgba(68,183,139,0.2)"/>
  <rect x="258" y="42" width="200" height="8" fill="rgba(68,183,139,0.2)"/>
  <text x="358" y="39" fill="#6EE7B7" font-size="10.5" text-anchor="middle" font-weight="700">🟢 Node.js / Express API</text>
  <text x="268" y="65" fill="#94A3B8" font-size="8.5">Routes:</text>
  <text x="268" y="80" fill="#64748B" font-size="8">► /api/projects  CRUD</text>
  <text x="268" y="94" fill="#64748B" font-size="8">► /api/tasks     CRUD</text>
  <text x="268" y="108" fill="#64748B" font-size="8">► /api/members   manage</text>
  <text x="268" y="122" fill="#64748B" font-size="8">► /api/auth      login</text>

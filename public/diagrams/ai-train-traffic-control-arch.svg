  <text x="234" y="86" fill="#64748B" font-size="8">► /api/trains/</text>
  <text x="234" y="100" fill="#64748B" font-size="8">► /api/schedules/</text>
  <text x="234" y="114" fill="#64748B" font-size="8">► /api/conflicts/detect/</text>
  <text x="234" y="128" fill="#64748B" font-size="8">► /api/routes/</text>
  <text x="234" y="142" fill="#64748B" font-size="8">► /api/decision/suggest/</text>


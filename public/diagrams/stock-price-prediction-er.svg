  <text x="22" y="274" fill="#94A3B8" font-size="8.5">  features_used · target_col</text>

  <line x1="214" y1="100" x2="280" y2="100" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4,3"/>

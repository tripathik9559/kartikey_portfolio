  <text x="288" y="135" fill="#94A3B8" font-size="8.5">  volume_ratio</text>
  <text x="288" y="149" fill="#94A3B8" font-size="8.5">  volatility</text>
  <text x="288" y="163" fill="#94A3B8" font-size="8.5">  rsi (relative strength)</text>
  <text x="288" y="177" fill="#34D399" font-size="8.5">  target: close_price (T+1)</text>

  <rect x="560" y="20" width="200" height="135" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>

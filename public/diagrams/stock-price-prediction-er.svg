  <text x="22" y="135" fill="#94A3B8" font-size="8.5">  close_price (target)</text>
  <text x="22" y="149" fill="#94A3B8" font-size="8.5">  volume</text>
  <text x="22" y="163" fill="#94A3B8" font-size="8.5">  adj_close</text>

  <rect x="280" y="20" width="210" height="175" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>

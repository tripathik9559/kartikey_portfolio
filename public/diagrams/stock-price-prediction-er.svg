  <text x="568" y="79" fill="#94A3B8" font-size="8.5">  actual_close</text>
  <text x="568" y="93" fill="#94A3B8" font-size="8.5">  predicted_close</text>
  <text x="568" y="107" fill="#94A3B8" font-size="8.5">  error (actual - pred)</text>
  <text x="568" y="121" fill="#94A3B8" font-size="8.5">  mae · rmse</text>
  <text x="568" y="135" fill="#94A3B8" font-size="8.5">  r2_score</text>

  <rect x="14" y="200" width="200" height="90" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(16,185,129,0.45)" stroke-width="1.5"/>

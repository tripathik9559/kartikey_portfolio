<svg viewBox="0 0 820 300" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
  <rect width="820" height="300" fill="#070B14" rx="12"/>

  <!-- USER table (Django auth_user) -->
  <rect x="14" y="20" width="158" height="160" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
  <rect x="14" y="20" width="158" height="28" rx="8" fill="rgba(59,130,246,0.18)"/>
  <rect x="14" y="40" width="158" height="8" fill="rgba(59,130,246,0.18)"/>
  <text x="93" y="38" fill="#93C5FD" font-size="10.5" text-anchor="middle" font-weight="700">👤 USER (auth)</text>
  <text x="22" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="22" y="79" fill="#94A3B8" font-size="8.5">  username</text>
  <text x="22" y="93" fill="#94A3B8" font-size="8.5">  email</text>
  <text x="22" y="107" fill="#94A3B8" font-size="8.5">  password (hashed)</text>
  <text x="22" y="121" fill="#34D399" font-size="8.5">  is_artist (bool)</text>
  <text x="22" y="135" fill="#94A3B8" font-size="8.5">  first_name</text>
  <text x="22" y="149" fill="#94A3B8" font-size="8.5">  last_name</text>
  <text x="22" y="163" fill="#94A3B8" font-size="8.5">  date_joined</text>

  <!-- ARTIST table -->
  <rect x="240" y="20" width="158" height="145" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(236,72,153,0.5)" stroke-width="1.5"/>
  <rect x="240" y="20" width="158" height="28" rx="8" fill="rgba(236,72,153,0.18)"/>
  <rect x="240" y="40" width="158" height="8" fill="rgba(236,72,153,0.18)"/>
  <text x="319" y="38" fill="#F9A8D4" font-size="10.5" text-anchor="middle" font-weight="700">🎨 ARTIST</text>
  <text x="248" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="248" y="79" fill="#F87171" font-size="8.5">🔗 user_id (FK→User, 1:1)</text>
  <text x="248" y="93" fill="#94A3B8" font-size="8.5">  bio</text>
  <text x="248" y="107" fill="#94A3B8" font-size="8.5">  profile_picture</text>
  <text x="248" y="121" fill="#94A3B8" font-size="8.5">  location</text>
  <text x="248" y="135" fill="#94A3B8" font-size="8.5">  website_url</text>
  <text x="248" y="149" fill="#94A3B8" font-size="8.5">  specialization</text>

  <!-- ARTWORK table -->
  <rect x="470" y="20" width="168" height="175" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(139,92,246,0.5)" stroke-width="1.5"/>
  <rect x="470" y="20" width="168" height="28" rx="8" fill="rgba(139,92,246,0.18)"/>
  <rect x="470" y="40" width="168" height="8" fill="rgba(139,92,246,0.18)"/>
  <text x="554" y="38" fill="#C4B5FD" font-size="10.5" text-anchor="middle" font-weight="700">🖼 ARTWORK</text>
  <text x="478" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="478" y="79" fill="#F87171" font-size="8.5">🔗 artist_id (FK→Artist)</text>
  <text x="478" y="93" fill="#F87171" font-size="8.5">🔗 category_id (FK→Category)</text>
  <text x="478" y="107" fill="#94A3B8" font-size="8.5">  title</text>
  <text x="478" y="121" fill="#94A3B8" font-size="8.5">  description</text>
  <text x="478" y="135" fill="#94A3B8" font-size="8.5">  image (FileField)</text>
  <text x="478" y="149" fill="#94A3B8" font-size="8.5">  price</text>
  <text x="478" y="163" fill="#94A3B8" font-size="8.5">  medium (oil/digital…)</text>
  <text x="478" y="177" fill="#34D399" font-size="8.5">  is_available</text>
  <text x="478" y="191" fill="#94A3B8" font-size="8.5">  created_at</text>

  <!-- CATEGORY table -->
  <rect x="240" y="186" width="158" height="100" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
  <rect x="240" y="186" width="158" height="28" rx="8" fill="rgba(6,182,212,0.18)"/>
  <rect x="240" y="206" width="158" height="8" fill="rgba(6,182,212,0.18)"/>
  <text x="319" y="204" fill="#67E8F9" font-size="10.5" text-anchor="middle" font-weight="700">🏷 CATEGORY</text>
  <text x="248" y="230" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="248" y="245" fill="#94A3B8" font-size="8.5">  name</text>
  <text x="248" y="260" fill="#94A3B8" font-size="8.5">  slug</text>
  <text x="248" y="275" fill="#94A3B8" font-size="8.5">  description</text>

  <!-- ORDER table -->
  <rect x="14" y="202" width="200" height="88" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
  <rect x="14" y="202" width="200" height="28" rx="8" fill="rgba(16,185,129,0.15)"/>
  <rect x="14" y="222" width="200" height="8" fill="rgba(16,185,129,0.15)"/>
  <text x="114" y="220" fill="#6EE7B7" font-size="10.5" text-anchor="middle" font-weight="700">🛒 ORDER</text>
  <text x="22" y="246" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="22" y="261" fill="#F87171" font-size="8.5">🔗 buyer_id · artwork_id (FK)</text>
  <text x="22" y="276" fill="#94A3B8" font-size="8.5">  ordered_at · status · amount</text>

  <!-- ARTIST_PROFILE extended -->
  <rect x="660" y="20" width="148" height="100" rx="8" fill="rgba(15,22,42,0.95)" stroke="rgba(245,158,11,0.35)" stroke-width="1.5"/>
  <rect x="660" y="20" width="148" height="28" rx="8" fill="rgba(245,158,11,0.12)"/>
  <rect x="660" y="40" width="148" height="8" fill="rgba(245,158,11,0.12)"/>
  <text x="734" y="38" fill="#FCD34D" font-size="10" text-anchor="middle" font-weight="700">⭐ REVIEW</text>
  <text x="668" y="64" fill="#FBBF24" font-size="8.5">🔑 id (PK)</text>
  <text x="668" y="79" fill="#F87171" font-size="8.5">🔗 artwork_id · buyer_id</text>
  <text x="668" y="93" fill="#94A3B8" font-size="8.5">  rating (1–5)</text>
  <text x="668" y="107" fill="#94A3B8" font-size="8.5">  comment</text>

  <!-- Relation lines -->
  <line x1="172" y1="90" x2="240" y2="90" stroke="#EC4899" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="206" y="84" fill="#EC4899" font-size="8" text-anchor="middle">1:1</text>

  <line x1="398" y1="80" x2="470" y2="80" stroke="#8B5CF6" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="434" y="74" fill="#8B5CF6" font-size="8" text-anchor="middle">1:M</text>

  <line x1="319" y1="165" x2="319" y2="186" stroke="#06B6D4" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="333" y="180" fill="#06B6D4" font-size="8">1:M</text>

  <line x1="398" y1="237" x2="470" y2="135" stroke="#06B6D4" stroke-width="1" stroke-dasharray="4,3" opacity="0.6"/>
  <text x="434" y="180" fill="#06B6D4" font-size="8" text-anchor="middle">M:1</text>

  <line x1="114" y1="180" x2="114" y2="202" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="128" y="196" fill="#10B981" font-size="8">1:M</text>

  <line x1="638" y1="100" x2="660" y2="70" stroke="#F59E0B" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="650" y="88" fill="#F59E0B" font-size="8">1:M</text>
</svg>
